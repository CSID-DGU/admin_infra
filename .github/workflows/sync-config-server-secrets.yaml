name: BLOCKED - Legacy Config Server Secret Sync

# Audit/history-only entrypoint. The former workflow copied an obsolete chart over
# SSH and changed a legacy release outside the FARM/LAB runner, digest, concurrency,
# and rollback boundaries. Keep the filename so an old runbook or operator receives
# an explicit refusal instead of a missing action.
on:
  workflow_dispatch:

# The refusal needs no repository token capability and receives no environment or
# repository Secret.
permissions: {}

jobs:
  blocked:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Legacy secret-sync path is permanently blocked
        shell: bash
        run: |
          set -euo pipefail
          echo "This legacy Config Server secret-sync workflow is permanently blocked." >&2
          echo "It does not check out code, read GitHub Secrets, open SSH, or mutate Helm/Kubernetes." >&2
          echo "Use Actions > Deploy FARM Config Server or Deploy LAB Config Server." >&2
          exit 1

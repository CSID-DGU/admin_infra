name: Sync Config Server Secrets to K8s

on:
  workflow_dispatch:  # NFS/Kerberos/farm 등 GH Secret 값만 바뀌었을 때 수동 실행. 이미지 빌드·재배포는 하지 않는다.
    # containerssh-config-server는 ailab-infra 네임스페이스에서 0 replica로 수동 축소돼 있다(운영 미사용).
    # replicaCount=0으로 고정해 helm upgrade가 이 사실을 되돌리지 않게 한다 — 실제로 되살리려면
    # Deploy Config Server 워크플로를 수동으로 다시 켜야 한다(팀 결정 필요).

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Chart 파일을 서버로 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.K8S_HOST }}
          username: ${{ secrets.K8S_USERNAME }}
          key: ${{ secrets.K8S_PRIVATE_KEY }}
          port: ${{ secrets.K8S_PORT }}
          source: "config-server/Chart"
          target: "~/deploy-temp-secret-sync"
          strip_components: 0

      - name: 🔑 helm release 값만 갱신 (replicaCount=0 고정, 이미지 태그는 --reuse-values로 유지)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.K8S_HOST }}
          username: ${{ secrets.K8S_USERNAME }}
          key: ${{ secrets.K8S_PRIVATE_KEY }}
          port: ${{ secrets.K8S_PORT }}
          script: |
            set -e
            helm upgrade containerssh-config-server ~/deploy-temp-secret-sync/config-server/Chart \
              --namespace ailab-infra \
              --reuse-values \
              --set replicaCount=0 \
              --set nfs.server=${{ secrets.NFS_SERVER }} \
              --set nfs.userSharePath=${{ secrets.NFS_USER_SHARE_PATH }} \
              --set nfs.kubeSharePath=${{ secrets.NFS_KUBE_SHARE_PATH }} \
              --set nas.ssh.host=${{ secrets.NAS_SSH_HOST }} \
              --set nas.ssh.port=${{ secrets.NAS_SSH_PORT }} \
              --set nas.ssh.user=${{ secrets.NAS_SSH_USER }} \
              --set nas.ssh.keyPath=${{ secrets.NAS_SSH_KEY_PATH }} \
              --set krb5.realm=${{ secrets.KRB5_REALM }} \
              --set farm.ssh.user=${{ secrets.FARM_SSH_USER }} \
              --set farm.ssh.keyPath=${{ secrets.FARM_SSH_KEY_PATH }} \
              --set-json farm.ssh.nodes='${{ secrets.FARM_NODES_JSON }}' \
              --set farm.adSsh.user=${{ secrets.FARM_AD_SSH_USER }} \
              --set farm.adSsh.keyPath=${{ secrets.FARM_AD_SSH_KEY_PATH }} \
              --set-json farm.adSsh.nodes='${{ secrets.FARM_AD_DC_NODES_JSON }}' \
              --force-conflicts
            echo "✅ containerssh-config-server release 값 갱신 완료 (replicas 0 유지, 라이브 Pod 없음)"
            kubectl -n ailab-infra get deployment containerssh-config-server -o jsonpath='replicas={.spec.replicas}{"\n"}'

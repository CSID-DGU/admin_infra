name: Deploy Proposed Stack
# 실행 목록에서 어느 스택에 무엇을 했는지 바로 보이게 입력값을 제목에 넣는다.
run-name: "${{ inputs.stack }} ${{ inputs.action }} — infra ${{ inputs.ref }} · fe ${{ inputs.fe_ref }} · be ${{ inputs.be_ref }}"

# 실험 스택(ailab-baseline / ailab-noprobe / ailab-full)과 실운영(ailab-operation)을 띄우거나 내린다.
# operation은 구 운영이 쓰던 계정 대장을 그대로 이어받는다 — 격리된 실험 스택이 아니다. 수동 실행 전용이다.
# 세 스택은 같은 코드이고 config-server의 실행 방식 하나만 다르다.
# 코드는 CSID-DGU/admin_infra-proposed, 프론트엔드는 CSID-DGU/admin_fe, 백엔드는 CSID-DGU/admin_be에서 가져온다.
# 브랜치 규칙(admin_wiki 브랜치-규칙.md): 네 저장소 모두 main 하나. 실험 스택은 main(또는 작업 브랜치)을,
# operation은 네 저장소에 같은 이름으로 찍은 릴리스 태그(vX.Y.Z)만 배포한다 — guard 작업이 막는다.
# 배포 시크릿은 이 레포의 것을 쓴다. 이미지 이름(config-server-exp)과
# helm 릴리스명(config-server-<stack>)은 스택마다 다르다. 실제 배포는 FARM-MGMT의 제한된
# self-hosted runner가 로컬 kubeconfig를 사용해 실행하며, SSH 키나 중간 배포 서버는 쓰지 않는다.
#
# 이미지 세 개를 각각 다른 작업에서 만든다(서로 병렬). 예전에는 한 작업에 15단계가 일렬로 붙어 있어
# 앞에서 하나만 깨져도 뒤가 전부 버려지고 다시 실행하면 처음부터 다시 만들었다. 지금은 만들어 둔
# 이미지가 레지스트리에 남아, 같은 커밋을 다시 돌리면 그 빌드를 건너뛴다.
# 세 스택은 같은 커밋을 쓰므로 config-server와 admin_be 이미지 태그가 서로 같다 — 먼저 돈 스택이
# 만들어 두면 나머지 둘은 빌드를 건너뛴다(프론트엔드만 스택별 주소가 달라 따로 만든다).

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "스택"
        type: choice
        options: [baseline, noprobe, full, operation]
        required: true
      ref:
        description: "admin_infra-proposed의 브랜치·태그·커밋 (operation은 릴리스 태그 vX.Y.Z만)"
        default: main
        required: true
      fe_ref:
        description: "CSID-DGU/admin_fe의 브랜치·태그·커밋 (operation은 릴리스 태그 vX.Y.Z만)"
        default: main
        required: true
      be_ref:
        description: "CSID-DGU/admin_be의 브랜치·태그·커밋 (operation은 릴리스 태그 vX.Y.Z만)"
        default: main
        required: true
      action:
        description: "probe: FARM-MGMT 실행 경로만 점검 / up: 띄우기(이미 있으면 재배포) / down: 실험 스택만 정리 후 내리기(operation 금지)"
        type: choice
        options: [probe, up, down]
        default: up

concurrency:
  group: proposed-stack-${{ inputs.stack }}
  cancel-in-progress: false

jobs:
  # operation은 세 저장소에 같은 이름으로 찍은 릴리스 태그만 받는다. 브랜치를 주면 배포 시점마다 다른 코드가
  # 운영에 올라가고, 무엇이 떠 있는지 태그 하나로 말할 수 없다.
  guard:
    runs-on: ubuntu-24.04
    steps:
      # operation은 기존 사용자 계정 대장을 공유한다. 범용 stack-down은 빈 접두어가 모든 운영 계정을
      # 대상으로 확장될 수 있으므로, 전용 폐기 절차가 생기기 전까지 workflow 입구에서 차단한다.
      - name: operation down 차단
        if: inputs.stack == 'operation' && inputs.action == 'down'
        run: |
          echo "operation down은 이 workflow에서 지원하지 않습니다. 운영 계정 전체에 영향을 줄 수 있어 전용 검토·폐기 절차가 필요합니다." >&2
          exit 1

      - name: operation 배포 대상 확인
        if: inputs.stack == 'operation' && inputs.action == 'up'
        env:
          REF: ${{ inputs.ref }}
          FE_REF: ${{ inputs.fe_ref }}
          BE_REF: ${{ inputs.be_ref }}
        run: |
          if ! [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$FE_REF" != "$REF" ] || [ "$BE_REF" != "$REF" ]; then
            echo "operation은 세 저장소에 같은 릴리스 태그(vX.Y.Z)만 배포합니다: ref=$REF fe_ref=$FE_REF be_ref=$BE_REF"
            exit 1
          fi

  # 실제 배포를 바꾸기 전에 FARM-MGMT 조직 러너, 로컬 kubeconfig, 배포 소스와 실행 도구를
  # 읽기 전용으로 점검한다. 이미지 빌드, Helm 변경, Kubernetes 쓰기 작업은 수행하지 않는다.
  executor-probe:
    needs: guard
    if: inputs.action == 'probe'
    runs-on:
      group: provi-farm-mgmt-deploy
      labels: provi-farm-mgmt-deploy
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 제안 시스템 코드 체크아웃
        uses: actions/checkout@v7
        with:
          repository: CSID-DGU/admin_infra-proposed
          ref: ${{ inputs.ref }}
          path: proposed
          persist-credentials: false

      - name: FARM-MGMT 로컬 실행 경로 읽기 전용 점검
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "farm-mgmt"
          test "$(id -un)" = "svmanager"

          readonly KUBECONFIG=/etc/kubernetes/ci-deployer.conf
          export KUBECONFIG
          test -r "$KUBECONFIG"
          test "$(stat -c '%U:%G:%a' "$KUBECONFIG")" = "root:svmanager:640"
          test "$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')" = "https://192.168.2.198:6443"
          test "$(kubectl --request-timeout=20s get --raw=/readyz)" = "ok"
          test "$(kubectl get nodes --no-headers | awk '$2 != "Ready" {count++} END {print count+0}')" = "0"

          for command in bash awk sed grep head od tr base64 sort sha256sum python3 ssh-keyscan kubectl helm; do
            command -v "$command" >/dev/null
          done
          for path in \
            proposed/config-server/Chart/Chart.yaml \
            proposed/infra-sql/pod_port_db.sql \
            proposed/infra-sql/operation_log.sql \
            proposed/infra-sql/trial_manifest.sql \
            proposed/ops/proposed-stack/stack-up.sh \
            proposed/ops/proposed-stack/stack-down.sh \
            proposed/ops/proposed-stack/cluster_profile.py \
            proposed/ops/proposed-stack/ssh_targets.py; do
            test -r "$path"
          done
          bash -n proposed/ops/proposed-stack/stack-up.sh
          bash -n proposed/ops/proposed-stack/stack-down.sh
          python3 -m py_compile \
            proposed/ops/proposed-stack/cluster_profile.py \
            proposed/ops/proposed-stack/ssh_targets.py

          helm version --short
          echo "admin_infra-proposed @ $(git -C proposed rev-parse HEAD)"
          echo "FARM-MGMT local deploy probe passed without a Kubernetes mutation"

  config-server:
    needs: guard
    if: inputs.action == 'up'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.src.outputs.sha }}
    steps:
      - name: 제안 시스템 코드 체크아웃
        uses: actions/checkout@v7
        with:
          repository: CSID-DGU/admin_infra-proposed
          ref: ${{ inputs.ref }}
          path: proposed

      - name: 배포할 커밋
        id: src
        run: |
          SHA=$(git -C proposed rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "admin_infra-proposed @ $SHA"

      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 같은 커밋으로 만든 이미지가 이미 올라가 있으면 다시 만들 이유가 없다. 세 스택이 같은 커밋을
      # 쓰므로 두 번째·세 번째 스택은 여기서 통째로 건너뛴다.
      - name: 이미 있는 이미지인지 확인
        id: exists
        run: |
          if docker manifest inspect "${{ secrets.DOCKER_USERNAME }}/config-server-exp:${{ steps.src.outputs.sha }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "같은 커밋의 이미지가 이미 있어 빌드를 건너뜁니다"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 빌더 준비
        if: steps.exists.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v4

      - name: config-server 이미지 빌드
        if: steps.exists.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ./proposed/config-server
          file: ./proposed/config-server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/config-server-exp:${{ steps.src.outputs.sha }}
          cache-from: type=gha,scope=config-server
          cache-to: type=gha,mode=max,scope=config-server

  frontend:
    needs: guard
    if: inputs.action == 'up'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.fe.outputs.sha }}
    steps:
      - name: 프론트엔드 코드 체크아웃
        uses: actions/checkout@v7
        with:
          repository: CSID-DGU/admin_fe
          ref: ${{ inputs.fe_ref }}
          path: fe

      # admin_fe의 nginx.conf는 /api/ 대상이 운영으로 고정돼 있다. 이 줄만 스택 주소로 바꿔 스택 전용 이미지를
      # 만든다(운영 프론트엔드 이미지·배포는 건드리지 않음). 옛 admin_fe는 /pod-status/로 config-server도
      # 직접 가리켰으므로, 그 줄이 있으면 함께 바꾼다(옛 버전으로 되돌려 배포할 때를 위해 남겨 둔다).
      - name: 프론트엔드 nginx 대상을 스택으로 변경
        id: fe
        run: |
          NS=ailab-${{ inputs.stack }}
          F=fe/nginx.conf
          if ! grep -q "admin-prod.default.svc.cluster.local" $F; then
            echo "admin_fe nginx.conf의 프록시 대상이 예상과 달라 중단"; exit 1
          fi
          sed -i -e "s#admin-prod.default.svc.cluster.local#admin-prod.$NS.svc.cluster.local#" \
                 -e "s#containerssh-config-service.ailab-infra.svc.cluster.local#containerssh-config-service.$NS.svc.cluster.local#" $F
          grep -n "proxy_pass" $F
          if grep -q "ailab-infra\|admin-prod.default" $F; then echo "운영 대상이 남아 있어 중단"; exit 1; fi
          echo "sha=$(git -C fe rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 프론트엔드는 프록시 대상이 스택마다 달라 태그에 스택 이름이 붙는다. 같은 커밋 + 같은 스택이면
      # 내용이 같으므로 건너뛴다.
      - name: 이미 있는 이미지인지 확인
        id: exists
        run: |
          if docker manifest inspect "${{ secrets.DOCKER_USERNAME }}/ailab-frontend-exp:${{ steps.fe.outputs.sha }}-${{ inputs.stack }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "같은 커밋의 이미지가 이미 있어 빌드를 건너뜁니다"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 빌더 준비
        if: steps.exists.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v4

      - name: 프론트엔드 이미지 빌드
        if: steps.exists.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ./fe
          file: ./fe/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ailab-frontend-exp:${{ steps.fe.outputs.sha }}-${{ inputs.stack }}
          cache-from: type=gha,scope=frontend-${{ inputs.stack }}
          cache-to: type=gha,mode=max,scope=frontend-${{ inputs.stack }}

  backend:
    needs: guard
    if: inputs.action == 'up'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.be.outputs.sha }}
    steps:
      # 스택 admin_be는 세 방식 모두 같은 브랜치에서 빌드한다. 운영 admin_be 배포(main push)에는 닿지 않는다.
      - name: admin_be 코드 체크아웃
        uses: actions/checkout@v7
        with:
          repository: CSID-DGU/admin_be
          ref: ${{ inputs.be_ref }}
          path: be

      - name: 커밋 확인
        id: be
        run: echo "sha=$(git -C be rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 이미지가 이미 있으면 소스 빌드까지 통째로 건너뛴다 — 여기가 이 워크플로에서 가장 오래 걸린다.
      - name: 이미 있는 이미지인지 확인
        id: exists
        run: |
          if docker manifest inspect "${{ secrets.DOCKER_USERNAME }}/admin-prod-exp:${{ steps.be.outputs.sha }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "같은 커밋의 이미지가 이미 있어 빌드를 건너뜁니다"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: JDK 17 설정
        if: steps.exists.outputs.skip == 'false'
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 운영 배포와 달리 application.yml을 굽지 않는다. 스택 admin_be는 운영 설정 Secret 복사본을
      # /app/config에 마운트해 받고, 스택 자원을 가리키는 값만 설치 스크립트가 덮어쓴다.
      - name: admin_be 빌드
        if: steps.exists.outputs.skip == 'false'
        run: |
          cd be
          ./gradlew build -x test

      - name: 빌더 준비
        if: steps.exists.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v4

      - name: admin_be 이미지 빌드
        if: steps.exists.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ./be
          file: ./be/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/admin-prod-exp:${{ steps.be.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    needs: [guard, config-server, frontend, backend]
    # 실험 스택 down은 이미지가 필요 없어 위 세 작업이 건너뛰어진다. operation down은 guard 실패와
    # 별개로 이 job 조건에서도 제외해 FARM-MGMT runner에 도달하지 못하게 한다.
    if: ${{ inputs.action != 'probe' && (inputs.stack != 'operation' || inputs.action != 'down') && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on:
      group: provi-farm-mgmt-deploy
      labels: provi-farm-mgmt-deploy
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: 제안 시스템 코드 체크아웃
        uses: actions/checkout@v7
        with:
          repository: CSID-DGU/admin_infra-proposed
          ref: ${{ inputs.ref }}
          path: proposed
          persist-credentials: false

      # 제한된 조직 runner가 FARM-MGMT에서 직접 실행한다. 별도 SSH 키·원격 임시 경로 없이 checkout된
      # 정확한 커밋과 로컬 API kubeconfig를 사용한다. build 작업은 계속 GitHub-hosted runner에서 수행한다.
      - name: FARM-MGMT에서 실행
        env:
          KUBECONFIG: /etc/kubernetes/ci-deployer.conf
          STACK: ${{ inputs.stack }}
          ACTION: ${{ inputs.action }}
          CONFIG_IMAGE: ${{ secrets.DOCKER_USERNAME }}/config-server-exp:${{ needs.config-server.outputs.sha }}
          FE_IMAGE: ${{ secrets.DOCKER_USERNAME }}/ailab-frontend-exp:${{ needs.frontend.outputs.sha }}-${{ inputs.stack }}
          BE_IMAGE: ${{ secrets.DOCKER_USERNAME }}/admin-prod-exp:${{ needs.backend.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(hostname)" = "farm-mgmt"
          test "$(id -un)" = "svmanager"
          test -r "$KUBECONFIG"
          test "$(stat -c '%U:%G:%a' "$KUBECONFIG")" = "root:svmanager:640"
          test "$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')" = "https://192.168.2.198:6443"
          test "$(kubectl --request-timeout=20s get --raw=/readyz)" = "ok"
          test "$(kubectl get nodes --no-headers | awk '$2 != "Ready" {count++} END {print count+0}')" = "0"

          cd proposed
          echo "admin_infra-proposed @ $(git rev-parse HEAD)"

          # workflow 조건이 향후 잘못 수정되더라도 실제 범용 stack-down 실행 직전에 다시 차단한다.
          if [ "$STACK" = "operation" ] && [ "$ACTION" = "down" ]; then
            echo "operation down은 FARM-MGMT 범용 배포 경로에서 실행할 수 없습니다." >&2
            exit 1
          fi

          case "$ACTION" in
            up)
              bash ops/proposed-stack/stack-up.sh "$STACK" "$CONFIG_IMAGE" "$FE_IMAGE" "$BE_IMAGE"
              ;;
            down)
              bash ops/proposed-stack/stack-down.sh "$STACK"
              ;;
            *)
              echo "지원하지 않는 action: $ACTION" >&2
              exit 2
              ;;
          esac

image:
  repository: dguailab/config-server
  tag: latest
  pullPolicy: Always

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30082

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 1024Mi

nfs:
  server: ""
  userSharePath: ""
  kubeSharePath: ""

nas:
  ssh:
    host: ""
    port: ""
    user: ""
    keyPath: ""

farm:
  ssh:
    user: ""
    keyPath: ""
    nodes: []
  adSsh:
    user: ""
    keyPath: ""
    nodes: []

security:
  sudoAllowedCommands: ""

krb5:
  realm: ""

infra:
  # GPU 유실 점검(check_gpu_pods.py)이 Slack 알림을 보낼 때 거치는 admin_be 내부 API.
  # 실제 webhook URL 값은 Secret(config-server-infra-slack-secret, key: webhookUrl)으로
  # 별도 관리 — 이 chart가 만들지 않으므로 배포 전에 직접 생성해야 한다:
  #   kubectl create secret generic config-server-infra-slack-secret \
  #     --from-literal=webhookUrl=<인프라 모니터링 채널 webhook URL> -n ailab-infra
  adminBeInternalUrl: "http://admin-prod.default"


config:
  namespace: ailab-infra


namespace: ailab-infra

cleanup:
  image: config-server:latest

db:
  host: "infra-mysql"
  name: "pod_port_db"
  user: "pod_port_user"

redis:
  host: redis-bg-master.ailab-infra.svc.cluster.local
  port: 6379

# config-server를 배포할 노드 고정
# csid-dgu-desktop은 control-plane 노드이므로 아래 tolerations와 함께 사용해야 한다.
nodeSelector:
  kubernetes.io/hostname: csid-dgu-desktop

# 데스크탑의 NoSchedule taint를 허용
tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"


apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-server-role
  namespace: {{ .Values.config.namespace }}
  labels:
    app: containerssh-config-server
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec", "pods/log", "services"]
  verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "create", "delete", "patch", "update"]
# krb5 keytab Secret(krb5-keytab-<user>) 생성/조회/삭제 — #82 KRB5 계정 연동
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-server-rolebinding
  namespace: {{ .Values.config.namespace }}
  labels:
    app: containerssh-config-server
subjects:
- kind: ServiceAccount
  name: config-server
  namespace: {{ .Values.config.namespace }}
roleRef:
  kind: Role
  name: config-server-role
  apiGroup: rbac.authorization.k8s.io
---
# nodes는 cluster-scoped — resolve_k8s_node_name() 등에서 list/get node 필요
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "containerssh-config-server.fullname" . }}-node-reader
  labels:
    app: containerssh-config-server
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "containerssh-config-server.fullname" . }}-node-reader-binding
  labels:
    app: containerssh-config-server
subjects:
  - kind: ServiceAccount
    name: config-server
    namespace: {{ .Values.config.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "containerssh-config-server.fullname" . }}-node-reader
  apiGroup: rbac.authorization.k8s.io
---
# services는 네임스페이스 전역에서 list 필요 — 기존 Role은 config-server 자신의
# namespace로 한정되어 다른 namespace의 서비스 조회 시 403 발생
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "containerssh-config-server.fullname" . }}-service-reader
  labels:
    app: containerssh-config-server
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "containerssh-config-server.fullname" . }}-service-reader-binding
  labels:
    app: containerssh-config-server
subjects:
  - kind: ServiceAccount
    name: config-server
    namespace: {{ .Values.config.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "containerssh-config-server.fullname" . }}-service-reader
  apiGroup: rbac.authorization.k8s.io
